name: Playwright Tests

# Follows the Replay docs:
# https://docs.replay.io/reference/test-runners/playwright/github-actions
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  # Aligned with package.json "packageManager": "pnpm@9.4.0"
  PNPM_VERSION: "9.4.0"

jobs:
  test:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    # Only run on successful Vercel preview deployments
    if: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Replay Chromium
        run: npx --yes replayio install

      # playwright.config.ts starts the Remix dev server (webServer) and
      # uses the replay-chromium project when REPLAY_API_KEY is set.
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=replay-chromium
        env:
          CI: "true"
          REPLAY_API_KEY: ${{ secrets.REPLAY_API_KEY }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
          NUT_LOGIN_KEY: ${{ secrets.NUT_LOGIN_KEY }}
          NUT_PASSWORD: ${{ secrets.NUT_PASSWORD }}

      # Upload only failed replays (per the "Advanced setup" example in the docs).
      - name: Upload replays
        if: ${{ always() }}
        uses: replayio/action-upload@v0.5.1
        with:
          api-key: ${{ secrets.REPLAY_API_KEY }}
          filter: ${{ 'function($v) { $v.metadata.test.result = "failed" }' }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy Playwright report to Vercel
        if: always()
        run: |
          cd playwright-report
          vercel link --project playwright-reports --yes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}

      # --- Second run against a Supabase-targeted deployment ---
      # Some tests need the Supabase-enabled target; deploy it and re-run.

      - name: Deploy to Vercel with Supabase Target
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --yes --target=supabase --token=${{ secrets.VERCEL_TOKEN }})
          WITH_SUPABASE_PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*' | tail -1)
          echo "WITH_SUPABASE_PREVIEW_URL=$WITH_SUPABASE_PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $WITH_SUPABASE_PREVIEW_URL"

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for deployment to be fully available..."
          timeout=300
          interval=10
          elapsed=0
          until curl -s --head --fail "${{ steps.deploy.outputs.WITH_SUPABASE_PREVIEW_URL }}" > /dev/null; do
            if [ $elapsed -ge $timeout ]; then
              echo "Timeout waiting for deployment to be available"
              exit 1
            fi
            echo "Waiting for deployment to be available... ($elapsed seconds elapsed)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          echo "Deployment is now available!"
          sleep 10

      # Do NOT pass `--reporter=html` alone: that replaces the config's
      # reporters (including replayReporter) and would skip uploads.
      - name: Run Playwright tests against Supabase deployment
        run: pnpm exec playwright test --project=replay-chromium
        env:
          CI: "true"
          REPLAY_API_KEY: ${{ secrets.REPLAY_API_KEY }}
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deploy.outputs.WITH_SUPABASE_PREVIEW_URL }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
          NUT_LOGIN_KEY: ${{ secrets.NUT_LOGIN_KEY }}
          NUT_PASSWORD: ${{ secrets.NUT_PASSWORD }}

      - name: Upload Playwright HTML report (Supabase run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-supabase
          path: playwright-report/
          retention-days: 30

      - name: Deploy Supabase Playwright report to Vercel
        if: always()
        run: |
          cd playwright-report
          vercel link --project playwright-reports --yes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
