name: Replay tests

# Follows the Replay docs:
# https://docs.replay.io/reference/test-runners/playwright/github-actions
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  # Aligned with package.json "packageManager": "pnpm@9.4.0"
  PNPM_VERSION: "9.4.0"

jobs:
  e2e-tests:
    name: Playwright Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Replay Chromium
        run: npx --yes replayio install

      # playwright.config.ts starts the Remix dev server (webServer) and
      # selects the replay-chromium project when REPLAY_API_KEY is set.
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=replay-chromium
        env:
          CI: "true"
          REPLAY_API_KEY: ${{ secrets.REPLAY_API_KEY }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
          NUT_LOGIN_KEY: ${{ secrets.NUT_LOGIN_KEY }}
          NUT_PASSWORD: ${{ secrets.NUT_PASSWORD }}

      # Upload only failed replays (per the "Advanced setup" example in the docs).
      - name: Upload replays
        if: ${{ always() }}
        uses: replayio/action-upload@v0.5.1
        with:
          api-key: ${{ secrets.REPLAY_API_KEY }}
          filter: ${{ 'function($v) { $v.metadata.test.result = "failed" }' }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
